<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Разметка карты колледжа</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", Roboto, sans-serif; background: #0e1116; color: #e6e9ef;
    font-size: 13px; }
  button, input, select, textarea { font-family: inherit; font-size: 13px; }
  #app { display: flex; height: 100%; }

  #side { width: 356px; min-width: 356px; background: #161a21; border-right: 1px solid #262c37;
    display: flex; flex-direction: column; overflow: hidden; }
  #side header { padding: 12px 14px; border-bottom: 1px solid #262c37; }
  #side h1 { font-size: 15px; margin: 0 0 3px; }
  .muted { color: #8b93a3; font-size: 11.5px; line-height: 1.45; }

  .sec { padding: 10px 14px; border-bottom: 1px solid #262c37; }
  .sec h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: #828b9b; margin: 0 0 8px; font-weight: 700; }
  .row { display: flex; gap: 6px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; }

  .btn { padding: 8px 10px; cursor: pointer; border-radius: 3px; text-align: center;
    background: #1e232c; color: #ccd3df; border: 1px solid #2e3644; white-space: nowrap; }
  .btn:hover { background: #252c37; border-color: #3a4454; }
  .btn.on { background: #0B3564; border-color: #0072CE; color: #fff; font-weight: 700; }
  .btn.acc { background: #123f74; border-color: #0072CE; color: #dbeaff; }
  .btn.danger { color: #ff9b9b; border-color: #5c2b2b; }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.sm { padding: 5px 8px; font-size: 12px; }

  .floors { display: flex; gap: 6px; }
  .floors .btn { flex: 1; }

  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .tools .btn { padding: 9px 4px; font-size: 11.5px; }

  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px;
    font-size: 12px; color: #9aa3b2; }
  .counts b { color: #e6e9ef; }

  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 7px 8px; background: #0e1116; color: #e6e9ef;
    border: 1px solid #2e3644; border-radius: 3px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #0072CE; }
  label.f { display: block; font-size: 11px; color: #8b93a3; margin: 8px 0 4px; }

  #list { flex: 1; overflow-y: auto; min-height: 90px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; cursor: pointer;
    border-bottom: 1px solid #1b2029; }
  .item:hover { background: #1b212a; }
  .item.sel { background: #12335c; }
  .item .num { font-weight: 700; color: #7fb2e8; min-width: 44px; }
  .item .ttl { color: #98a1b0; flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-size: 12px; }
  .st { font-size: 10px; padding: 1px 5px; border-radius: 2px; }
  .st.normal { background: #14304f; color: #7fb2e8; }
  .st.closed { background: #343a44; color: #b9c0cc; }
  .st.nonexistent { background: #4a2020; color: #ff9d9d; }
  .st.service { background: #2c3a28; color: #b6d99c; }

  .chk { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer;
    color: #ccd3df; }
  .chk input { width: auto; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }

  #stage { flex: 1; position: relative; overflow: hidden; background: #090b0f; }
  #stage.tool-cross { cursor: crosshair; }
  #stage.tool-pan { cursor: grab; }
  #stage.panning { cursor: grabbing; }

  #viewport { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  .planWrap { display: none; position: absolute; top: 0; left: 0; }
  .planWrap.on { display: block; }
  .planWrap svg { display: block; width: 2048px; height: 1143px; }
  #overlay { position: absolute; top: 0; left: 0; }

  #hint { position: absolute; left: 12px; bottom: 12px; max-width: 55%;
    background: rgba(10,13,18,.92); padding: 8px 12px; border-radius: 3px;
    color: #9aa3b2; font-size: 12px; border: 1px solid #262c37; }
  #toast { position: absolute; right: 12px; top: 12px; background: rgba(10,13,18,.92);
    padding: 8px 12px; border-radius: 3px; color: #9fd39f; font-size: 12px;
    border: 1px solid #26372c; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.on { opacity: 1; }

  #zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 6px; }
  #zoombar .btn { background: rgba(10,13,18,.9); }

  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none;
    align-items: center; justify-content: center; z-index: 60; }
  #modal.on { display: flex; }
  #modal .card { background: #161a21; border: 1px solid #2e3644; border-radius: 4px;
    padding: 18px; width: 360px; }
  #modal h3 { margin: 0 0 10px; font-size: 14px; }
  #modal .btns { display: flex; gap: 8px; margin-top: 14px; }
  #modal .btns .btn { flex: 1; }
  .sugg { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .sugg .btn { padding: 4px 9px; font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>Разметка карты колледжа</h1>
      <div class="muted">Векторные планы. Разметка сохраняется в файл — его отдать разработчику.</div>
    </header>

    <div class="sec">
      <h2>Этаж</h2>
      <div class="floors" id="floors"></div>
    </div>

    <div class="sec">
      <h2>Инструмент</h2>
      <div class="tools" id="tools"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm grow" id="btnUndo" disabled>Отменить</button>
        <button class="btn sm grow" id="btnRedo" disabled>Вернуть</button>
      </div>
    </div>

    <div class="sec">
      <h2>Умная разметка</h2>
      <label class="chk"><input type="checkbox" id="autoContour" checked> Прижимать рамку к стенам</label>
      <label class="chk"><input type="checkbox" id="alignNeighbors" checked> Ровнять с соседями</label>
      <div class="row" style="margin-top:8px">
        <button class="btn sm grow acc" id="btnSnapAll">Выровнять этаж</button>
        <button class="btn sm grow" id="btnDetect">Найти кабинеты</button>
      </div>
      <div class="muted" style="margin-top:6px">
        «Найти кабинеты» ищет замкнутые области на плане и создаёт их как кабинеты —
        останется вписать номера.
      </div>
    </div>

    <div class="sec">
      <h2>На плане</h2>
      <div class="counts" id="counts"></div>
    </div>

    <div class="sec">
      <h2>Кабинеты</h2>
      <input type="text" id="search" placeholder="Поиск по номеру или названию">
      <div class="row" style="margin-top:6px">
        <select id="filter" class="grow">
          <option value="">Все статусы</option>
          <option value="normal">Обычные</option>
          <option value="closed">Закрытые</option>
          <option value="nonexistent">Не существуют</option>
          <option value="service">Служебные</option>
        </select>
        <button class="btn sm" id="btnBulk">Выделенным…</button>
      </div>
    </div>

    <div id="list"></div>

    <div class="sec" id="inspector" style="display:none">
      <h2>Выбранный кабинет</h2>
      <label class="f">Номер</label>
      <input type="text" id="fNumber">
      <label class="f">Название помещения</label>
      <input type="text" id="fTitle" placeholder="Библиотека, Актовый зал…">
      <label class="f">Статус</label>
      <select id="fStatus">
        <option value="normal">Обычный</option>
        <option value="closed">Закрыт</option>
        <option value="nonexistent">Не существует</option>
        <option value="service">Служебный</option>
      </select>
      <label class="f">Заметка</label>
      <textarea id="fNote" rows="2" placeholder="Например: вход со двора"></textarea>
      <label class="f">Координаты (доли плана)</label>
      <div class="row"><input type="number" id="fX" step="0.0001" placeholder="центр X">
        <input type="number" id="fY" step="0.0001" placeholder="центр Y"></div>
      <div class="row" style="margin-top:4px"><input type="number" id="fW" step="0.0001" placeholder="ширина">
        <input type="number" id="fH" step="0.0001" placeholder="высота"></div>
    </div>

    <div class="sec">
      <h2>Слои</h2>
      <div class="layers" id="layers"></div>
      <label class="f">Прозрачность плана</label>
      <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="1" style="width:100%">
    </div>

    <div class="sec" style="border-bottom:none">
      <h2>Файлы</h2>
      <div class="row wrap">
        <button class="btn sm grow" id="btnSave">Сохранить JSON</button>
        <button class="btn sm grow" id="btnLoad">Открыть JSON</button>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <button class="btn sm grow acc" id="btnRooms">Загрузить rooms.json</button>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <button class="btn sm grow" id="btnSvg">Экспорт SVG</button>
        <button class="btn sm grow" id="btnPng">Экспорт PNG</button>
      </div>
      <div class="row wrap" style="margin-top:6px">
        <button class="btn sm grow danger" id="btnClear">Очистить этаж</button>
      </div>
      <input type="file" id="fileJson" accept=".json,application/json" style="display:none">
    </div>
  </aside>

  <main id="stage">
    <div id="viewport">
      <div class="planWrap" data-floor="1">

  ['label',    'Подпись',  'T', 'Клик — текст в произвольном месте плана.'],
  ['callout',  'Выноска',  'O', 'Клик по кабинету, затем в стороне — текст с линией-указателем.'],
  ['route',    'Маршрут',  'M', 'Кликами нарисуй готовый путь. Enter — конец.'],
  ['ruler',    'Линейка',  'L', 'Протяни отрезок — покажет длину в долях и в метрах.'],
  ['eraser',   'Ластик',   'X', 'Клик по объекту — удалить.'],
  ['pan',      'Двигать',  'Пробел', 'Тяни мышью, чтобы сдвинуть план. Колесо — зум.'],
];

const STATUSES = [
  ['normal',      'Обычный',       '#0072CE', 'rgba(0,114,206,.16)',   ''],
  ['closed',      'Закрыт',        '#8b93a3', 'rgba(139,147,163,.22)', '6 4'],
  ['nonexistent', 'Не существует', '#c0392b', 'rgba(192,57,43,.14)',   ''],
  ['service',     'Служебный',     '#16a34a', 'rgba(22,163,74,.10)',   '2 4'],
];
const COL = {
  corridor: '#f0a500', node: '#e8c55a', callout: '#8b5cf6', route: '#e11d48',
  entranceMain: '#0d9488', entranceBack: '#0ea5e9', entranceStairs: '#7c3aed',
  label: '#111827',
};

const STORE = 'mpk-map-editor-v3';
const MAX_HISTORY = 80;

const $ = id => document.getElementById(id);
const stage = $('stage'), viewport = $('viewport'), overlay = $('overlay');

const emptyFloor = () => ({ rooms: [], corridors: [], nodes: [], labels: [], callouts: [], routes: [], entrances: [] });

const S = {
  floor: '1', tool: 'room',
  zoom: 1, panX: 0, panY: 0,
  data: { '1': emptyFloor(), '2': emptyFloor(), '3-4': emptyFloor() },
  selection: [], history: [], hIndex: -1,
  opacity: 1, scaleMeters: null,
  layers: { rooms: true, numbers: true, corridors: true, nodes: true,
            labels: true, callouts: true, routes: true, entrances: true },
  pending: null, anchorNode: null, calloutTarget: null,
  drag: null, statusToApply: 'nonexistent',
};

const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round4 = v => Math.round(v * 10000) / 10000;
const data = () => S.data[S.floor];
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function toast(t) {
  const el = $('toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2400);
}
function isSel(type, id) { return S.selection.some(s => s.type === type && s.id === id); }
function findAny(id) {
  const d = data();
  return [...d.rooms, ...d.nodes, ...d.labels, ...d.entrances, ...d.callouts].find(o => o.id === id) || null;
}
const toNorm = (x, y) => ({ x: x / NAT.w, y: y / NAT.h });
function eventToImage(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left - S.panX) / S.zoom, y: (e.clientY - r.top - S.panY) / S.zoom };
}
const rectPx = r => ({
  x: (r.x - r.w / 2) * NAT.w, y: (r.y - r.h / 2) * NAT.h,
  w: r.w * NAT.w, h: r.h * NAT.h,
});

// ===========================================================================
//  История и сохранение
// ===========================================================================

function pushHistory() {
  const snap = JSON.stringify({ data: S.data, scaleMeters: S.scaleMeters });
  if (S.history[S.hIndex] === snap) return;
  S.history = S.history.slice(0, S.hIndex + 1);
  S.history.push(snap);
  if (S.history.length > MAX_HISTORY) S.history.shift();
  S.hIndex = S.history.length - 1;
  updateHistoryBtns();
}
function updateHistoryBtns() {
  $('btnUndo').disabled = S.hIndex <= 0;
  $('btnRedo').disabled = S.hIndex >= S.history.length - 1;
}
function applySnap(snap) {
  const o = JSON.parse(snap);
  S.data = o.data;
  S.scaleMeters = o.scaleMeters ?? null;
}
function undo() { if (S.hIndex > 0) { S.hIndex--; applySnap(S.history[S.hIndex]); afterChange(false); } }
function redo() { if (S.hIndex < S.history.length - 1) { S.hIndex++; applySnap(S.history[S.hIndex]); afterChange(false); } }

function afterChange(persist = true) {
  render();
  if (persist) { pushHistory(); saveLocal(); }
}

function saveLocal() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      data: S.data, floor: S.floor, scaleMeters: S.scaleMeters,
      layers: S.layers, opacity: S.opacity,
    }));
  } catch (e) { toast('Хранилище переполнено — сохраните файл'); }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (o.data) S.data = Object.assign({ '1': emptyFloor(), '2': emptyFloor(), '3-4': emptyFloor() }, o.data);
    if (o.floor) S.floor = o.floor;
    if (o.scaleMeters != null) S.scaleMeters = o.scaleMeters;
    if (o.layers) Object.assign(S.layers, o.layers);
    if (o.opacity != null) S.opacity = o.opacity;
    return true;
  } catch (e) { return false; }
}

// ===========================================================================
//  Стены: разбираем векторный план на пиксели
// ===========================================================================

let wallMask = null;

function currentPlanSvg() {
  return document.querySelector('.planWrap.on svg');
}

function buildWallMask() {
  const svg = currentPlanSvg();
  if (!svg) { wallMask = null; return; }
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', NAT.w);
  clone.setAttribute('height', NAT.h);
  const str = new XMLSerializer().serializeToString(clone);

  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas');
      c.width = NAT.w; c.height = NAT.h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, NAT.w, NAT.h);
      const px = ctx.getImageData(0, 0, NAT.w, NAT.h).data;
      const mask = new Uint8Array(NAT.w * NAT.h);
      for (let i = 0, p = 0; i < px.length; i += 4, p++) {
        const r = px[i], g = px[i + 1], b = px[i + 2];
        if ((r + g + b) / 3 < 150 && Math.abs(r - g) < 70 && Math.abs(r - b) < 70) mask[p] = 1;
      }
      wallMask = mask;
      toast('План разобран — прижатие к стенам готово');
    } catch (e) { wallMask = null; }
  };
  img.onerror = () => { wallMask = null; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

function snapCol(xGuess, y0, y1) {
  if (!wallMask) return xGuess;
  const win = 30, lo = Math.max(0, Math.round(xGuess) - win), hi = Math.min(NAT.w - 1, Math.round(xGuess) + win);
  y0 = clamp(Math.round(y0), 0, NAT.h - 1); y1 = clamp(Math.round(y1), 0, NAT.h - 1);
  const span = Math.max(1, y1 - y0);
  let best = xGuess, bestScore = 0;
  for (let x = lo; x <= hi; x++) {
    let n = 0;
    for (let y = y0; y <= y1; y++) n += wallMask[y * NAT.w + x];
    const cov = n / span;
    if (cov > bestScore || (cov === bestScore && Math.abs(x - xGuess) < Math.abs(best - xGuess))) {
      bestScore = cov; best = x;
    }
  }
  return bestScore >= 0.42 ? best : xGuess;
}

function snapRow(yGuess, x0, x1) {
  if (!wallMask) return yGuess;
  const win = 30, lo = Math.max(0, Math.round(yGuess) - win), hi = Math.min(NAT.h - 1, Math.round(yGuess) + win);
  x0 = clamp(Math.round(x0), 0, NAT.w - 1); x1 = clamp(Math.round(x1), 0, NAT.w - 1);
  const span = Math.max(1, x1 - x0);
  let best = yGuess, bestScore = 0;
  for (let y = lo; y <= hi; y++) {
    let n = 0;
    for (let x = x0; x <= x1; x++) n += wallMask[y * NAT.w + x];
    const cov = n / span;
    if (cov > bestScore || (cov === bestScore && Math.abs(y - yGuess) < Math.abs(best - yGuess))) {
      bestScore = cov; best = y;
    }
  }
  return bestScore >= 0.42 ? best : yGuess;
}

function autoContour(x0, y0, x1, y1) {
  if (!wallMask) return { x0, y0, x1, y1 };
  let X0 = x0, X1 = x1, Y0 = y0, Y1 = y1;

  if ($('autoContour').checked) {
    X0 = snapCol(x0, y0, y1); X1 = snapCol(x1, y0, y1);
    if (X1 - X0 < 8) { X0 = x0; X1 = x1; }
    Y0 = snapRow(y0, X0, X1); Y1 = snapRow(y1, X0, X1);
    if (Y1 - Y0 < 8) { Y0 = y0; Y1 = y1; }
  }
  if ($('alignNeighbors').checked && data().rooms.length) {
    const tol = 11, xs = [], ys = [];
    data().rooms.forEach(r => {
      const p = rectPx(r);
      xs.push(Math.round(p.x), Math.round(p.x + p.w));
      ys.push(Math.round(p.y), Math.round(p.y + p.h));
    });
    const near = (v, list) => {
      let bv = v, bd = tol;
      list.forEach(c => { const d = Math.abs(c - v); if (d < bd) { bd = d; bv = c; } });
      return bv;
    };
    X0 = near(X0, xs); X1 = near(X1, xs); Y0 = near(Y0, ys); Y1 = near(Y1, ys);
  }
  return { x0: X0, y0: Y0, x1: X1, y1: Y1 };
}

function snapAllRooms() {
  if (!wallMask) { toast('План ещё разбирается, секунду'); return; }
  let moved = 0;
  data().rooms.forEach(r => {
    const p = rectPx(r);
    const c = autoContour(p.x, p.y, p.x + p.w, p.y + p.h);
    if (c.x1 - c.x0 < 6 || c.y1 - c.y0 < 6) return;
    if (Math.abs(c.x0 - p.x) > 1 || Math.abs(c.y0 - p.y) > 1) moved++;
    r.x = round4(((c.x0 + c.x1) / 2) / NAT.w);
    r.y = round4(((c.y0 + c.y1) / 2) / NAT.h);
    r.w = round4((c.x1 - c.x0) / NAT.w);
    r.h = round4((c.y1 - c.y0) / NAT.h);
  });
  afterChange();
  toast('Подогнано кабинетов: ' + moved);
}

// ===========================================================================
//  Автопоиск кабинетов
// ===========================================================================

/** Расширяет стены: проёмы дверей закрываются, комнаты становятся замкнутыми. */
function dilateMask(src, r) {
  const w = NAT.w, h = NAT.h;
  const tmp = new Uint8Array(w * h), out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      let hit = 0;
      for (let d = -r; d <= r; d++) {
        const xx = x + d;
        if (xx >= 0 && xx < w && src[row + xx]) { hit = 1; break; }
      }
      tmp[row + x] = hit;
    }
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      let hit = 0;
      for (let d = -r; d <= r; d++) {
        const yy = y + d;
        if (yy >= 0 && yy < h && tmp[yy * w + x]) { hit = 1; break; }
      }
      out[y * w + x] = hit;
    }
  }
  return out;
}

function detectRooms() {
  if (!wallMask) { toast('План ещё разбирается'); return; }
  toast('Ищу замкнутые области…');

  setTimeout(() => {
    const walls = dilateMask(wallMask, 9);
    const labels = new Int32Array(NAT.w * NAT.h);
    const queue = new Int32Array(NAT.w * NAT.h);
    const comps = [];

    for (let start = 0; start < labels.length; start++) {
      if (walls[start] || labels[start]) continue;
      const id = comps.length + 1;
      let head = 0, tail = 0;
      queue[tail++] = start;
      labels[start] = id;
      let minX = NAT.w, maxX = 0, minY = NAT.h, maxY = 0, area = 0, border = false;

      while (head < tail) {
        const p = queue[head++];
        const y = (p / NAT.w) | 0, x = p - y * NAT.w;
        area++;
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (x === 0 || y === 0 || x === NAT.w - 1 || y === NAT.h - 1) border = true;

        if (x > 0 && !walls[p - 1] && !labels[p - 1]) { labels[p - 1] = id; queue[tail++] = p - 1; }
        if (x < NAT.w - 1 && !walls[p + 1] && !labels[p + 1]) { labels[p + 1] = id; queue[tail++] = p + 1; }
        if (y > 0 && !walls[p - NAT.w] && !labels[p - NAT.w]) { labels[p - NAT.w] = id; queue[tail++] = p - NAT.w; }
        if (y < NAT.h - 1 && !walls[p + NAT.w] && !labels[p + NAT.w]) { labels[p + NAT.w] = id; queue[tail++] = p + NAT.w; }
      }
      comps.push({ area, minX, maxX, minY, maxY, border });
    }

    const found = comps.filter(c => {
      if (c.border) return false;
      const bw = c.maxX - c.minX, bh = c.maxY - c.minY;
      if (bw < 26 || bh < 26) return false;
      return c.area / Math.max(1, bw * bh) >= 0.45;
    });

    if (!found.length) { toast('Замкнутых кабинетов не нашлось'); return; }

    found.sort((a, b) => (a.minY - b.minY) || (a.minX - b.minX));
    found.forEach(c => {
      data().rooms.push({
        id: uid('room'), number: '', title: '', note: '', status: 'normal',
        x: round4(((c.minX + c.maxX) / 2) / NAT.w),
        y: round4(((c.minY + c.maxY) / 2) / NAT.h),
        w: round4((c.maxX - c.minX) / NAT.w),
        h: round4((c.maxY - c.minY) / NAT.h),
      });
    });
    afterChange();
    toast('Найдено кабинетов: ' + found.length + ' — впишите номера');
  }, 40);
}

// ===========================================================================
//  Отрисовка
// ===========================================================================

function applyTransform() {
  viewport.style.transform = 'translate(' + S.panX + 'px, ' + S.panY + 'px) scale(' + S.zoom + ')';
}
function resizeOverlay() {
  overlay.setAttribute('viewBox', '0 0 ' + NAT.w + ' ' + NAT.h);
  overlay.setAttribute('width', NAT.w);
  overlay.setAttribute('height', NAT.h);
}
function clampPan() {
  const r = stage.getBoundingClientRect();
  const cw = NAT.w * S.zoom, ch = NAT.h * S.zoom;
  S.panX = cw <= r.width ? (r.width - cw) / 2 : clamp(S.panX, r.width - cw, 0);
  S.panY = ch <= r.height ? (r.height - ch) / 2 : clamp(S.panY, r.height - ch, 0);
}
function fitToScreen() {
  const r = stage.getBoundingClientRect();
  S.zoom = clamp(Math.min(r.width / NAT.w, r.height / NAT.h), 0.08, 8);
  clampPan();
  applyTransform();
}
function zoomBy(f) {
  const r = stage.getBoundingClientRect();
  const mx = r.width / 2, my = r.height / 2;
  const bx = (mx - S.panX) / S.zoom, by = (my - S.panY) / S.zoom;
  S.zoom = clamp(S.zoom * f, 0.08, 10);
  S.panX = mx - bx * S.zoom; S.panY = my - by * S.zoom;
  clampPan(); applyTransform();
}
const statusStyle = st => STATUSES.find(s => s[0] === st) || STATUSES[0];

function render() {
  const d = data();
  // Прозрачная подложка во всю картинку: гарантирует, что клик по пустому
  // месту плана вообще дойдёт до слоя разметки, а не провалится мимо
  const out = ['<rect x="0" y="0" width="' + NAT.w + '" height="' + NAT.h +
    '" fill="transparent" pointer-events="all"/>'];

  if (S.layers.corridors) {
    d.corridors.forEach(c => {
      out.push('<polyline points="' + c.points.map(p => (p[0] * NAT.w) + ',' + (p[1] * NAT.h)).join(' ') +
        '" fill="none" stroke="' + COL.corridor + '" stroke-width="' + ((c.width || 0.012) * NAT.w) +
        '" stroke-linecap="round" stroke-linejoin="round" opacity=".8" data-type="corridor" data-id="' + c.id + '"/>');
    });
  }

  if (S.layers.routes) {
    d.routes.forEach(rt => {
      out.push('<polyline points="' + rt.points.map(p => (p[0] * NAT.w) + ',' + (p[1] * NAT.h)).join(' ') +
        '" fill="none" stroke="' + (rt.color || COL.route) + '" stroke-width="4" stroke-dasharray="9 6"' +
        ' stroke-linecap="round" data-type="route" data-id="' + rt.id + '"/>');
    });
  }

  if (S.layers.nodes) {
    const by = {};
    d.nodes.forEach(n => by[n.id] = n);
    d.nodes.forEach(n => (n.links || []).forEach(o => {
      const t = by[o];
      if (!t || n.id > o) return;
      out.push('<line x1="' + (n.x * NAT.w) + '" y1="' + (n.y * NAT.h) + '" x2="' + (t.x * NAT.w) +
        '" y2="' + (t.y * NAT.h) + '" stroke="' + COL.node + '" stroke-width="3" opacity=".9"/>');
    }));
    d.nodes.forEach(n => {
      out.push('<circle cx="' + (n.x * NAT.w) + '" cy="' + (n.y * NAT.h) + '" r="' +
        (isSel('node', n.id) ? 9 : 6) + '" fill="' + COL.node + '" stroke="#3a2f00" data-type="node" data-id="' + n.id + '"/>');
    });
  }

  if (S.layers.rooms) {
    d.rooms.forEach(r => {
      const p = rectPx(r), st = statusStyle(r.status), sel = isSel('room', r.id);
      out.push('<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h +
        '" fill="' + st[3] + '" stroke="' + (sel ? '#ffffff' : st[2]) + '" stroke-width="' + (sel ? 4 : 2) + '"' +
        (st[4] ? ' stroke-dasharray="' + st[4] + '"' : '') +
        ' data-type="room" data-id="' + r.id + '"/>');

      if (r.status === 'nonexistent') {
        out.push('<line x1="' + p.x + '" y1="' + p.y + '" x2="' + (p.x + p.w) + '" y2="' + (p.y + p.h) +
          '" stroke="' + st[2] + '" stroke-width="2" pointer-events="none"/>');
        out.push('<line x1="' + (p.x + p.w) + '" y1="' + p.y + '" x2="' + p.x + '" y2="' + (p.y + p.h) +
          '" stroke="' + st[2] + '" stroke-width="2" pointer-events="none"/>');
      }
      if (S.layers.numbers && r.number) {
        const fs = clamp(Math.min(p.h * 0.55, p.w * 0.45), 9, 26);
        out.push('<text x="' + (p.x + p.w / 2) + '" y="' + (p.y + p.h / 2 + fs * 0.35) + '" font-size="' + fs +
          '" font-weight="700" text-anchor="middle" fill="' +
          (r.status === 'nonexistent' ? st[2] : '#0B3564') + '" pointer-events="none">' + esc(r.number) + '</text>');
      }
      if (r.title) {
        const fs = clamp(p.h * 0.28, 8, 15);
        out.push('<text x="' + (p.x + p.w / 2) + '" y="' + (p.y + p.h - fs * 0.5) + '" font-size="' + fs +
          '" text-anchor="middle" fill="#5b6675" pointer-events="none">' + esc(r.title) + '</text>');
      }
    });
  }

  if (S.layers.entrances) {
    d.entrances.forEach(en => {
      const x = en.x * NAT.w, y = en.y * NAT.h, s = 11;
      const col = en.kind === 'main' ? COL.entranceMain
                : en.kind === 'stairs' ? COL.entranceStairs : COL.entranceBack;
      out.push('<polygon points="' + x + ',' + (y - s) + ' ' + (x + s) + ',' + y + ' ' + x + ',' + (y + s) +
        ' ' + (x - s) + ',' + y + '" fill="' + col + '" stroke="#0b0e13" data-type="entrance" data-id="' + en.id + '"/>');
      out.push('<text x="' + x + '" y="' + (y + s + 14) + '" font-size="13" text-anchor="middle" fill="' + col +
        '" pointer-events="none">' + esc(en.title || '') + '</text>');
    });
  }

  if (S.layers.labels) {
    d.labels.forEach(l => {
      out.push('<text x="' + (l.x * NAT.w) + '" y="' + (l.y * NAT.h) + '" font-size="' + (l.size || 16) +
        '" font-weight="600" text-anchor="middle" fill="' + COL.label +
        '" style="paint-order:stroke;stroke:#fff;stroke-width:5px" data-type="label" data-id="' + l.id + '">' +
        esc(l.text) + '</text>');
    });
  }

  if (S.layers.callouts) {
    d.callouts.forEach(c => {
      const t = findAny(c.targetId);
      if (t) {
        const a = t.w != null ? rectPx(t) : { x: t.x * NAT.w, y: t.y * NAT.h, w: 0, h: 0 };
        out.push('<line x1="' + (c.x * NAT.w) + '" y1="' + (c.y * NAT.h) + '" x2="' + (a.x + a.w / 2) +
          '" y2="' + (a.y + a.h / 2) + '" stroke="' + COL.callout +
          '" stroke-width="2" stroke-dasharray="5 4" pointer-events="none"/>');
      }
      out.push('<circle cx="' + (c.x * NAT.w) + '" cy="' + (c.y * NAT.h) + '" r="4" fill="' + COL.callout + '" pointer-events="none"/>');
      out.push('<text x="' + (c.x * NAT.w) + '" y="' + (c.y * NAT.h - 8) + '" font-size="15" font-weight="600"' +
        ' text-anchor="middle" fill="' + COL.callout +
        '" style="paint-order:stroke;stroke:#fff;stroke-width:5px" data-type="callout" data-id="' + c.id + '">' +
        esc(c.text) + '</text>');
    });
  }

  if (S.pending && S.pending.points && S.pending.points.length) {
    const col = S.pending.type === 'corridor' ? COL.corridor
              : S.pending.type === 'route' ? COL.route : COL.node;
    out.push('<polyline points="' + S.pending.points.map(p => (p[0] * NAT.w) + ',' + (p[1] * NAT.h)).join(' ') +
      '" fill="none" stroke="' + col + '" stroke-width="4" stroke-dasharray="7 5" pointer-events="none"/>');
  }

  if (S.pending && S.pending.type === 'ruler' && S.pending.points.length === 2) {
    const a = S.pending.points[0], b = S.pending.points[1];
    const dx = (b[0] - a[0]) * NAT.w, dy = (b[1] - a[1]) * NAT.h;
    const frac = Math.hypot(dx, dy) / NAT.w;
    let label = (frac * 100).toFixed(1) + '% ширины';
    if (S.scaleMeters) label += '  ≈  ' + (frac * S.scaleMeters).toFixed(1) + ' м';
    out.push('<line x1="' + (a[0] * NAT.w) + '" y1="' + (a[1] * NAT.h) + '" x2="' + (b[0] * NAT.w) +
      '" y2="' + (b[1] * NAT.h) + '" stroke="#e11d48" stroke-width="3" pointer-events="none"/>');
    out.push('<text x="' + ((a[0] + b[0]) / 2 * NAT.w) + '" y="' + ((a[1] + b[1]) / 2 * NAT.h - 10) +
      '" font-size="16" font-weight="700" text-anchor="middle" fill="#e11d48"' +
      ' style="paint-order:stroke;stroke:#fff;stroke-width:5px" pointer-events="none">' + esc(label) + '</text>');
  }

  overlay.innerHTML = out.join('');
  renderCounts();
  renderList();
  renderInspector();
}

function renderCounts() {
  const d = data();
  $('counts').innerHTML = [
    ['Кабинеты', d.rooms.length], ['Коридоры', d.corridors.length],
    ['Узлы', d.nodes.length], ['Маршруты', d.routes.length],
    ['Входы', d.entrances.length], ['Подписи', d.labels.length + d.callouts.length],
  ].map(x => '<div>' + x[0] + ': <b>' + x[1] + '</b></div>').join('');
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const f = $('filter').value;
  const rooms = data().rooms
    .filter(r => !f || r.status === f)
    .filter(r => !q || (r.number || '').toLowerCase().includes(q) || (r.title || '').toLowerCase().includes(q))
    .sort((a, b) => (a.number || '~').localeCompare(b.number || '~', undefined, { numeric: true }));

  const host = $('list');
  if (!rooms.length) {
    host.innerHTML = '<div class="item muted" style="cursor:default">Пусто</div>';
    return;
  }
  const names = { normal: 'обычный', closed: 'закрыт', nonexistent: 'нет', service: 'служ.' };
  host.innerHTML = rooms.map(r =>
    '<div class="item ' + (isSel('room', r.id) ? 'sel' : '') + '" data-id="' + r.id + '">' +
    '<span class="num">' + esc(r.number || '—') + '</span>' +
    '<span class="ttl">' + esc(r.title || r.note || '') + '</span>' +
    '<span class="st ' + r.status + '">' + names[r.status] + '</span></div>').join('');

  host.querySelectorAll('.item[data-id]').forEach(el => {
    el.onclick = () => {
      const room = data().rooms.find(r => r.id === el.dataset.id);
      if (!room) return;
      S.selection = [{ type: 'room', id: room.id }];
      centerOn(room.x, room.y, Math.max(S.zoom, 1.6));
      render();
    };
  });
}

function centerOn(nx, ny, z) {
  const r = stage.getBoundingClientRect();
  S.zoom = z;
  S.panX = r.width / 2 - nx * NAT.w * z;
  S.panY = r.height / 2 - ny * NAT.h * z;
  clampPan(); applyTransform();
}

function renderInspector() {
  const box = $('inspector');
  const room = S.selection.length === 1 && S.selection[0].type === 'room'
    ? data().rooms.find(r => r.id === S.selection[0].id) : null;
  if (!room) { box.style.display = 'none'; return; }
  box.style.display = '';
  if (box.contains(document.activeElement)) return;
  $('fNumber').value = room.number || '';
  $('fTitle').value = room.title || '';
  $('fStatus').value = room.status || 'normal';
  $('fNote').value = room.note || '';
  $('fX').value = round4(room.x);
  $('fY').value = round4(room.y);
  $('fW').value = round4(room.w);
  $('fH').value = round4(room.h);
}

// ===========================================================================
//  Панель
// ===========================================================================

function buildPanel() {
  $('floors').innerHTML = FLOORS.map(f =>
    '<button class="btn ' + (S.floor === f.id ? 'on' : '') + '" data-floor="' + f.id + '">' + f.title + '</button>').join('');
  $('floors').querySelectorAll('[data-floor]').forEach(b => b.onclick = () => switchFloor(b.dataset.floor));

  $('tools').innerHTML = TOOLS.map(t =>
    '<button class="btn ' + (S.tool === t[0] ? 'on' : '') + '" data-tool="' + t[0] + '" title="' + esc(t[2]) +
    '">' + esc(t[1]) + '</button>').join('');
  $('tools').querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));

  const names = { rooms: 'Кабинеты', numbers: 'Номера', corridors: 'Коридоры', nodes: 'Узлы',
                  labels: 'Подписи', callouts: 'Выноски', routes: 'Маршруты', entrances: 'Входы' };
  $('layers').innerHTML = Object.keys(names).map(k =>
    '<label class="chk"><input type="checkbox" data-layer="' + k + '"' + (S.layers[k] ? ' checked' : '') +
    '>' + names[k] + '</label>').join('');
  $('layers').querySelectorAll('[data-layer]').forEach(cb => cb.onchange = () => {
    S.layers[cb.dataset.layer] = cb.checked;
    saveLocal(); render();
  });
}

function switchFloor(id) {
  S.floor = id;
  S.selection = []; S.pending = null; S.calloutTarget = null; S.anchorNode = null;
  document.querySelectorAll('.planWrap').forEach(w => w.classList.toggle('on', w.dataset.floor === id));
  buildPanel();
  saveLocal();
  buildWallMask();
  fitToScreen();
  render();
}

function setTool(t) {
  S.tool = t;
  S.pending = null;
  S.calloutTarget = null;
  stage.className = (t === 'pan') ? 'tool-pan' : 'tool-cross';
  buildPanel();
  render();
  const info = TOOLS.find(x => x[0] === t);
  $('hint').textContent = (info ? info[3] : '') +
    (t === 'status' ? '  Текущий статус: ' + statusStyle(S.statusToApply)[1] + '.' : '');
}

// ===========================================================================
//  Окно ввода
// ===========================================================================

function ask(title, value, onOk, suggestions) {
  const m = $('modal'), input = $('mInput'), sugg = $('mSugg');
  $('mTitle').textContent = title;
  input.value = value || '';
  sugg.innerHTML = '';
  (suggestions || []).forEach(s => {
    const b = document.createElement('button');
    b.className = 'btn sm'; b.textContent = s;
    b.onclick = () => { input.value = s; input.focus(); };
    sugg.appendChild(b);
  });
  m.classList.add('on');
  setTimeout(() => { input.focus(); input.select(); }, 30);

  function done(ok) {
    m.classList.remove('on');
    $('mOk').onclick = null; $('mCancel').onclick = null; input.onkeydown = null;
    if (ok) onOk(input.value.trim());
  }
  $('mOk').onclick = () => done(true);
  $('mCancel').onclick = () => done(false);
  input.onkeydown = e => { if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
}

function nextNumbers() {
  const taken = new Set(data().rooms.map(r => r.number));
  const base = S.floor === '1' ? 100 : S.floor === '2' ? 200 : 300;
  let max = base;
  taken.forEach(n => { const v = parseInt(n, 10); if (!isNaN(v) && v > max && v < base + 100) max = v; });
  const out = [];
  for (let n = max + 1; out.length < 6 && n < base + 100; n++) if (!taken.has(String(n))) out.push(String(n));
  return out;
}

// ===========================================================================
//  Мышь
// ===========================================================================

overlay.addEventListener('pointerdown', e => {
  if (e.button === 1 || S.tool === 'pan') { startPan(e); return; }
  const pt = eventToImage(e), norm = toNorm(pt.x, pt.y);
  const hit = e.target.closest ? e.target.closest('[data-type]') : null;

  if (S.tool === 'select')   return startSelect(e, hit, norm);
  if (S.tool === 'room')     return startRoom(e, pt);
  if (S.tool === 'status')   return applyStatus(hit);
  if (S.tool === 'eraser')   { if (hit) eraseObject(hit.dataset.type, hit.dataset.id); return; }
  if (S.tool === 'corridor') return addPoint('corridor', norm);
  if (S.tool === 'route')    return addPoint('route', norm);
  if (S.tool === 'ruler')    return startRuler(e, norm);
  if (S.tool === 'node')     return addNode(norm);
  if (S.tool === 'label')    return addLabel(norm);
  if (S.tool === 'callout')  return handleCallout(hit, norm);
  if (S.tool === 'entrance') return addEntrance(norm);
});

overlay.addEventListener('pointermove', e => {
  if (!S.drag) return;
  const pt = eventToImage(e), norm = toNorm(pt.x, pt.y);

  if (S.drag.type === 'pan') {
    S.panX = e.clientX - S.drag.sx; S.panY = e.clientY - S.drag.sy;
    clampPan(); applyTransform(); return;
  }
  if (S.drag.type === 'rect') {
    let px0 = Math.min(S.drag.px0, pt.x), px1 = Math.max(S.drag.px0, pt.x);
    let py0 = Math.min(S.drag.py0, pt.y), py1 = Math.max(S.drag.py0, pt.y);
    if (px1 - px0 > 8 && py1 - py0 > 8) {
      const c = autoContour(px0, py0, px1, py1);
      px0 = c.x0; py0 = c.y0; px1 = c.x1; py1 = c.y1;
    }
    S.drag.rect = { x0: px0 / NAT.w, y0: py0 / NAT.h, x1: px1 / NAT.w, y1: py1 / NAT.h };
    drawDraft();
    return;
  }
  if (S.drag.type === 'ruler') { S.pending.points[1] = [norm.x, norm.y]; render(); return; }
  if (S.drag.type === 'marquee') {
    const x0 = Math.min(S.drag.norm.x, norm.x), x1 = Math.max(S.drag.norm.x, norm.x);
    const y0 = Math.min(S.drag.norm.y, norm.y), y1 = Math.max(S.drag.norm.y, norm.y);
    S.selection = S.drag.base.slice();
    data().rooms.forEach(r => {
      if (r.x > x0 && r.x < x1 && r.y > y0 && r.y < y1) S.selection.push({ type: 'room', id: r.id });
    });
    render(); return;
  }
  if (S.drag.type === 'move') {
    const dx = norm.x - S.drag.last.x, dy = norm.y - S.drag.last.y;
    if (dx || dy) S.drag.moved = true;
    S.drag.last = norm;
    S.selection.forEach(s => {
      const o = findAny(s.id);
      if (!o) return;
      if (o.points) o.points = o.points.map(p => [p[0] + dx, p[1] + dy]);
      else { o.x += dx; o.y += dy; }
    });
    render();
  }
});

overlay.addEventListener('pointerup', () => {
  if (!S.drag) return;
  const t = S.drag.type;

  if (t === 'rect') {
    const r = S.drag.rect;
    S.drag = null; S.pending = null;
    if (r && (r.x1 - r.x0) > 0.006 && (r.y1 - r.y0) > 0.006) {
      const room = {
        id: uid('room'), number: '', title: '', note: '', status: 'normal',
        x: round4((r.x0 + r.x1) / 2), y: round4((r.y0 + r.y1) / 2),
        w: round4(r.x1 - r.x0), h: round4(r.y1 - r.y0),
      };
      data().rooms.push(room);
      S.selection = [{ type: 'room', id: room.id }];
      afterChange();
      ask('Номер кабинета', '', v => { if (v) room.number = v; afterChange(); }, nextNumbers());
      return;
    }
    render(); return;
  }
  if (t === 'marquee') { S.drag = null; render(); return; }
  if (t === 'move') {
    const moved = S.drag.moved; S.drag = null;
    if (moved) afterChange(); else render();
    return;
  }
  S.drag = null; render();
});

overlay.addEventListener('dblclick', finishPoly);

function startPan(e) {
  S.drag = { type: 'pan', sx: e.clientX - S.panX, sy: e.clientY - S.panY };
  stage.classList.add('panning');
  overlay.setPointerCapture(e.pointerId);
}

function startSelect(e, hit, norm) {
  if (hit) {
    const type = hit.dataset.type, id = hit.dataset.id;
    if (e.shiftKey) {
      if (isSel(type, id)) S.selection = S.selection.filter(s => s.id !== id);
      else S.selection.push({ type, id });
    } else if (!isSel(type, id)) S.selection = [{ type, id }];
    S.drag = { type: 'move', last: norm };
    overlay.setPointerCapture(e.pointerId);
    render();
    return;
  }
  S.drag = { type: 'marquee', norm, base: e.shiftKey ? S.selection.slice() : [] };
  overlay.setPointerCapture(e.pointerId);
}

/** Клик внутри кабинета — рамка определяется сама. */
function startRoom(e, pt) {
  const guess = 26;
  const c = autoContour(pt.x - guess, pt.y - guess, pt.x + guess, pt.y + guess);
  S.drag = { type: 'rect', px0: pt.x, py0: pt.y, rect: null, preset: c };
  overlay.setPointerCapture(e.pointerId);
}

function applyStatus(hit) {
  if (!hit || hit.dataset.type !== 'room') { toast('Кликни по кабинету'); return; }
  const room = data().rooms.find(r => r.id === hit.dataset.id);
  if (!room) return;
  room.status = S.statusToApply;
  afterChange();
}

function drawDraft() {
  const old = overlay.querySelector('.draft');
  if (old) old.remove();
  const r = S.drag && S.drag.rect;
  if (!r) return;
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  el.setAttribute('class', 'draft');
  el.setAttribute('x', r.x0 * NAT.w); el.setAttribute('y', r.y0 * NAT.h);
  el.setAttribute('width', (r.x1 - r.x0) * NAT.w); el.setAttribute('height', (r.y1 - r.y0) * NAT.h);
  el.setAttribute('fill', 'rgba(255,209,102,.22)');
  el.setAttribute('stroke', '#ffd166'); el.setAttribute('stroke-width', '3');
  overlay.appendChild(el);
}

function addPoint(type, norm) {
  if (!S.pending || S.pending.type !== type) S.pending = { type, points: [] };
  S.pending.points.push([norm.x, norm.y]);
  render();
}

function finishPoly() {
  if (!S.pending || !S.pending.points || S.pending.type === 'ruler') return;
  const type = S.pending.type, points = S.pending.points;
  S.pending = null;
  if (points.length < 2) { render(); return; }
  if (type === 'corridor') {
    data().corridors.push({ id: uid('cor'), points, width: 0.012 });
    afterChange(); toast('Коридор добавлен');
  } else if (type === 'route') {
    ask('Название маршрута (необязательно)', '', v => {
      data().routes.push({ id: uid('rt'), points, color: COL.route, title: v });
      afterChange();
    });
  } else {
    render();
  }
}

function addNode(norm) {
  const n = { id: uid('n'), x: round4(norm.x), y: round4(norm.y), links: [] };
  if (S.anchorNode) {
    const from = data().nodes.find(x => x.id === S.anchorNode);
    if (from) { from.links.push(n.id); n.links.push(from.id); }
  }
  data().nodes.push(n);
  S.anchorNode = n.id;
  afterChange();
  toast('Узел. Следующий соединится с ним. Esc — разъединить.');
}

function addLabel(norm) {
  ask('Текст подписи', '', v => {
    if (v) data().labels.push({ id: uid('l'), x: round4(norm.x), y: round4(norm.y), text: v, size: 16 });
    afterChange();
  });
}

function handleCallout(hit, norm) {
  if (!S.calloutTarget) {
    if (hit) { S.calloutTarget = hit.dataset.id; toast('Теперь кликни там, где поставить текст'); }
    else toast('Сначала кликни по кабинету');
    return;
  }
  const target = S.calloutTarget;
  S.calloutTarget = null;
  ask('Текст выноски', '', v => {
    if (v) data().callouts.push({ id: uid('c'), x: round4(norm.x), y: round4(norm.y), text: v, targetId: target });
    afterChange();
  });
}

function addEntrance(norm) {
  ask('Что это за вход?', '', v => {
    const t = (v || '').toLowerCase();
    const kind = t.includes('лестн') ? 'stairs' : t.includes('запасн') ? 'backup' : 'main';
    data().entrances.push({
      id: uid('e'), x: round4(norm.x), y: round4(norm.y), kind,
      title: v || (kind === 'main' ? 'Главный вход' : kind === 'stairs' ? 'Лестница' : 'Запасной выход'),
    });
    afterChange();
  }, ['Главный вход', 'Запасной выход', 'Лестница']);
}

function eraseObject(type, id) {
  const d = data();
  const key = { room: 'rooms', corridor: 'corridors', node: 'nodes', label: 'labels',
                callout: 'callouts', route: 'routes', entrance: 'entrances' }[type];
  if (!key) return;
  const i = d[key].findIndex(o => o.id === id);
  if (i < 0) return;
  d[key].splice(i, 1);
  if (type === 'node') {
    d.nodes.forEach(n => n.links = (n.links || []).filter(l => l !== id));
    d.callouts = d.callouts.filter(c => c.targetId !== id);
  }
  if (type === 'room') d.callouts = d.callouts.filter(c => c.targetId !== id);
  S.selection = [];
  afterChange();
}

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const bx = (mx - S.panX) / S.zoom, by = (my - S.panY) / S.zoom;
  S.zoom = clamp(S.zoom * (e.deltaY < 0 ? 1.16 : 1 / 1.16), 0.08, 10);
  S.panX = mx - bx * S.zoom; S.panY = my - by * S.zoom;
  clampPan(); applyTransform();
}, { passive: false });

// ===========================================================================
//  Массовые операции
// ===========================================================================

function bulkMenu() {
  if (!S.selection.filter(s => s.type === 'room').length) { toast('Сначала выдели кабинеты'); return; }
  const choice = prompt(
    'Что сделать с выделенными?\n\n' +
    '1 — обычный\n2 — закрыт\n3 — не существует\n4 — служебный\n' +
    '5 — вписать номера по порядку\n6 — удалить', '3');
  if (!choice) return;
  const ids = S.selection.filter(s => s.type === 'room').map(s => s.id);
  const rooms = data().rooms.filter(r => ids.includes(r.id));

  if (choice >= '1' && choice <= '4') {
    const st = ['normal', 'closed', 'nonexistent', 'service'][Number(choice) - 1];
    rooms.forEach(r => r.status = st);
    afterChange();
    toast('Статус «' + statusStyle(st)[1] + '» у ' + rooms.length + ' кабинетов');
  } else if (choice === '5') {
    const start = parseInt(prompt('Первый номер:', String(nextNumbers()[0] || 101)) || '', 10);
    if (isNaN(start)) return;
    rooms.sort((a, b) => (a.y - b.y) || (a.x - b.x));
    rooms.forEach((r, i) => r.number = String(start + i));
    afterChange();
    toast('Номера: ' + start + '…' + (start + rooms.length - 1));
  } else if (choice === '6') {
    const set = new Set(ids);
    data().rooms = data().rooms.filter(r => !set.has(r.id));
    S.selection = [];
    afterChange();
    toast('Удалено кабинетов: ' + ids.length);
  }
}

// ===========================================================================
//  Файлы
// ===========================================================================

function download(text, name, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function saveFile() {
  download(JSON.stringify({ version: 1, scaleMeters: S.scaleMeters, floors: S.data }, null, 2),
           'map-data.json', 'application/json');
  toast('Файл сохранён');
}
function importProject(text) {
  const o = JSON.parse(text);
  if (!o.floors) throw new Error('нет поля floors');
  if (!confirm('Заменить текущие данные файлом?')) return;
  ['1', '2', '3-4'].forEach(f => {
    const t = emptyFloor(), src = o.floors[f] || {};
    Object.keys(t).forEach(k => { t[k] = Array.isArray(src[k]) ? src[k] : []; });
    o.floors[f] = t;
  });
  S.data = o.floors;
  S.scaleMeters = o.scaleMeters ?? null;
  S.selection = [];
  afterChange();
  toast('Данные загружены');
}
function importRooms(text) {
  const o = JSON.parse(text);
  if (!o.floors) throw new Error('нет поля floors');
  let added = 0, updated = 0;
  Object.keys(o.floors).forEach(fid => {
    const src = o.floors[fid];
    if (!src || !Array.isArray(src.rooms)) return;
    if (!S.data[fid]) S.data[fid] = emptyFloor();
    src.rooms.forEach(r => {
      if (!r.number || r.x == null) return;
      const ex = S.data[fid].rooms.find(x => x.number === r.number);
      if (ex) { Object.assign(ex, { x: r.x, y: r.y, w: r.w, h: r.h }); updated++; }
      else {
        S.data[fid].rooms.push({
          id: r.id || uid('room'), number: r.number, title: r.title || '',
          note: r.note || '', status: r.status || 'normal',
          x: r.x, y: r.y, w: r.w, h: r.h,
        });
        added++;
      }
    });
  });
  afterChange();
  toast('Добавлено ' + added + ', обновлено ' + updated);
}
function buildStandaloneSvg() {
  const svg = currentPlanSvg();
  const inner = svg ? svg.innerHTML : '';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + NAT.w + '" height="' + NAT.h +
    '" viewBox="0 0 ' + NAT.w + ' ' + NAT.h + '"><rect width="' + NAT.w + '" height="' + NAT.h +
    '" fill="#ffffff"/><g>' + inner + '</g>' + overlay.innerHTML + '</svg>';
}
function exportSvg() {
  download(buildStandaloneSvg(), 'plan-' + S.floor + '.svg', 'image/svg+xml');
  toast('SVG сохранён');
}
function exportPng() {
  const str = buildStandaloneSvg();
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = NAT.w; c.height = NAT.h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'plan-' + S.floor + '.png'; a.click();
    });
  };
  img.onerror = () => toast('Не удалось собрать PNG');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

// ===========================================================================
//  Кнопки и формы
// ===========================================================================

function bind() {
  $('btnUndo').onclick = undo;
  $('btnRedo').onclick = redo;
  $('search').oninput = renderList;
  $('filter').onchange = renderList;
  $('btnBulk').onclick = bulkMenu;
  $('btnSnapAll').onclick = snapAllRooms;
  $('btnDetect').onclick = detectRooms;
  $('btnZoomIn').onclick = () => zoomBy(1.25);
  $('btnZoomOut').onclick = () => zoomBy(1 / 1.25);
  $('btnZoomFit').onclick = fitToScreen;

  $('opacity').oninput = () => {
    S.opacity = parseFloat($('opacity').value);
    document.querySelectorAll('.planWrap').forEach(w => w.style.opacity = S.opacity);
    saveLocal();
  };

  $('btnSave').onclick = saveFile;
  $('btnLoad').onclick = () => { $('fileJson').dataset.mode = ''; $('fileJson').click(); };
  $('btnRooms').onclick = () => { $('fileJson').dataset.mode = 'rooms'; $('fileJson').click(); };
  $('fileJson').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const mode = e.target.dataset.mode;
    const fr = new FileReader();
    fr.onload = () => {
      try { if (mode === 'rooms') importRooms(fr.result); else importProject(fr.result); }
      catch (err) { alert('Не получилось прочитать файл: ' + err.message); }
    };
    fr.readAsText(f);
    e.target.value = '';
  };

  $('btnSvg').onclick = exportSvg;
  $('btnPng').onclick = exportPng;
  $('btnClear').onclick = () => {
    if (!confirm('Удалить всю разметку этого этажа?')) return;
    S.data[S.floor] = emptyFloor();
    S.selection = [];
    afterChange();
  };

  const bindField = function (id, fn) {
    $(id).addEventListener('input', function () {
      const room = S.selection.length === 1 && S.selection[0].type === 'room'
        ? data().rooms.find(r => r.id === S.selection[0].id) : null;
      if (room) fn(room, $(id).value);
    });
    $(id).addEventListener('change', function () {
      if (S.selection.some(s => s.type === 'room')) afterChange();
    });
  };
  bindField('fNumber', (r, v) => r.number = v);
  bindField('fTitle', (r, v) => r.title = v);
  bindField('fNote', (r, v) => r.note = v);
  bindField('fStatus', (r, v) => r.status = v);
  bindField('fX', (r, v) => { const n = parseFloat(v); if (!isNaN(n)) r.x = n; });
  bindField('fY', (r, v) => { const n = parseFloat(v); if (!isNaN(n)) r.y = n; });
  bindField('fW', (r, v) => { const n = parseFloat(v); if (n > 0) r.w = n; });
  bindField('fH', (r, v) => { const n = parseFloat(v); if (n > 0) r.h = n; });
}

window.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { S.pending = null; S.anchorNode = null; S.calloutTarget = null; render(); return; }
  if (e.key === 'Enter') { finishPoly(); return; }
  if (typing) return;

  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
  if (ctrl && e.key.toLowerCase() === 'a') {
    e.preventDefault();
    S.selection = data().rooms.map(r => ({ type: 'room', id: r.id }));
    render(); return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    S.selection.slice().forEach(s => eraseObject(s.type, s.id));
    return;
  }
  if (e.key === ' ') { setTool('pan'); e.preventDefault(); return; }
  const t = TOOLS.find(x => x[2].toLowerCase() === e.key.toLowerCase());
  if (t) setTool(t[0]);
});

window.addEventListener('resize', () => { clampPan(); applyTransform(); });

// ===========================================================================
//  Запуск
// ===========================================================================

function start() {
  loadLocal();
  document.querySelectorAll('.planWrap').forEach(w => {
    w.classList.toggle('on', w.dataset.floor === S.floor);
    w.style.opacity = S.opacity;
  });
  $('opacity').value = S.opacity;
  resizeOverlay();
  buildPanel();
  bind();
  setTool(S.tool);
  fitToScreen();
  render();
  pushHistory();
  buildWallMask();
}

start();
</script>
</body>
